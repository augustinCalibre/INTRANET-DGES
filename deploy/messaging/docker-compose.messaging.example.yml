services:
  intranet-db:
    image: postgres:16-alpine
    container_name: dges-intranet-db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${INTRANET_POSTGRES_DB}
      POSTGRES_USER: ${INTRANET_POSTGRES_USER}
      POSTGRES_PASSWORD: ${INTRANET_POSTGRES_PASSWORD}
    volumes:
      - intranet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dges_net

  intranet-web:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: dges-intranet-web
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG}
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_HOST: intranet-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${INTRANET_POSTGRES_DB}
      POSTGRES_USER: ${INTRANET_POSTGRES_USER}
      POSTGRES_PASSWORD: ${INTRANET_POSTGRES_PASSWORD}
    depends_on:
      intranet-db:
        condition: service_healthy
    volumes:
      - intranet_static:/app/staticfiles
      - intranet_media:/app/media
    expose:
      - "8000"
    networks:
      - dges_net

  nextcloud-db:
    image: postgres:16-alpine
    container_name: dges-nextcloud-db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${NEXTCLOUD_POSTGRES_DB}
      POSTGRES_USER: ${NEXTCLOUD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_POSTGRES_PASSWORD}
    volumes:
      - nextcloud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dges_net

  nextcloud-redis:
    image: redis:7-alpine
    container_name: dges-nextcloud-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nextcloud_redis_data:/data
    networks:
      - dges_net

  nextcloud-app:
    image: ${NEXTCLOUD_IMAGE}
    container_name: dges-nextcloud-app
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_POSTGRES_DB}
      POSTGRES_USER: ${NEXTCLOUD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_POSTGRES_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      REDIS_HOST: nextcloud-redis
      PHP_MEMORY_LIMIT: ${NEXTCLOUD_PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${NEXTCLOUD_PHP_UPLOAD_LIMIT}
      APACHE_BODY_LIMIT: ${NEXTCLOUD_APACHE_BODY_LIMIT}
      APACHE_DISABLE_REWRITE_IP: "1"
      TRUSTED_PROXIES: ${NEXTCLOUD_TRUSTED_PROXIES}
      SMTP_HOST: ${NEXTCLOUD_SMTP_HOST}
      SMTP_SECURE: ${NEXTCLOUD_SMTP_SECURE}
      SMTP_PORT: ${NEXTCLOUD_SMTP_PORT}
      SMTP_AUTHTYPE: ${NEXTCLOUD_SMTP_AUTHTYPE}
      SMTP_NAME: ${NEXTCLOUD_SMTP_NAME}
      SMTP_PASSWORD: ${NEXTCLOUD_SMTP_PASSWORD}
      MAIL_FROM_ADDRESS: ${NEXTCLOUD_MAIL_FROM_ADDRESS}
      MAIL_DOMAIN: ${NEXTCLOUD_MAIL_DOMAIN}
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_custom_apps:/var/www/html/custom_apps
      - nextcloud_config:/var/www/html/config
      - nextcloud_data:/var/www/html/data
    expose:
      - "80"
    networks:
      - dges_net

  nextcloud-cron:
    image: ${NEXTCLOUD_IMAGE}
    container_name: dges-nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_POSTGRES_DB}
      POSTGRES_USER: ${NEXTCLOUD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_POSTGRES_PASSWORD}
      REDIS_HOST: nextcloud-redis
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_custom_apps:/var/www/html/custom_apps
      - nextcloud_config:/var/www/html/config
      - nextcloud_data:/var/www/html/data
    networks:
      - dges_net

  coturn:
    image: coturn/coturn:4.6.3
    container_name: dges-coturn
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn_data:/var/lib/coturn
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "${TURN_PORT_MIN}-${TURN_PORT_MAX}:${TURN_PORT_MIN}-${TURN_PORT_MAX}/udp"
    networks:
      - dges_net

  nginx:
    image: nginx:1.27-alpine
    container_name: dges-edge-nginx
    restart: unless-stopped
    depends_on:
      - intranet-web
      - nextcloud-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dges-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - intranet_static:/var/www/intranet/static:ro
      - intranet_media:/var/www/intranet/media:ro
      - nginx_logs:/var/log/nginx
    networks:
      - dges_net

volumes:
  intranet_postgres_data:
  intranet_static:
  intranet_media:
  nextcloud_postgres_data:
  nextcloud_redis_data:
  nextcloud_html:
  nextcloud_custom_apps:
  nextcloud_config:
  nextcloud_data:
  coturn_data:
  nginx_logs:

networks:
  dges_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
