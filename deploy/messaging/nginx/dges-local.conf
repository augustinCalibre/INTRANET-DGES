map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name intranet.dges.local messagerie.dges.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name intranet.dges.local;

    ssl_certificate /etc/nginx/certs/dges.local.crt;
    ssl_certificate_key /etc/nginx/certs/dges.local.key;

    client_max_body_size 100M;

    location /static/ {
        alias /var/www/intranet/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /var/www/intranet/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://intranet-web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    server_name messagerie.dges.local;

    ssl_certificate /etc/nginx/certs/dges.local.crt;
    ssl_certificate_key /etc/nginx/certs/dges.local.key;

    client_max_body_size 2G;
    proxy_request_buffering off;

    location = /.well-known/carddav {
        return 301 /remote.php/dav/;
    }

    location = /.well-known/caldav {
        return 301 /remote.php/dav/;
    }

    location / {
        proxy_pass http://nextcloud-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
