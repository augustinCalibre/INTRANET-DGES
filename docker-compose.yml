services:
  db:
    image: postgres:16-alpine
    container_name: intranet-dges-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intranet_dges_network

  nextcloud-db:
    image: postgres:16-alpine
    container_name: intranet-dges-nextcloud-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${NEXTCLOUD_POSTGRES_DB}
      POSTGRES_USER: ${NEXTCLOUD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_POSTGRES_PASSWORD}
    volumes:
      - nextcloud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intranet_dges_network

  nextcloud-redis:
    image: redis:7-alpine
    container_name: intranet-dges-nextcloud-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nextcloud_redis_data:/data
    networks:
      - intranet_dges_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intranet-dges-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      # Lecture seule : l'onglet « Sauvegarde et restauration » liste les
      # archives et permet de les télécharger. Il n'écrit jamais dedans.
      - ${BACKUP_DIR:-./sauvegardes}:/sauvegardes:ro
      # Canal de commande vers le service backup : l'application y dépose ses
      # demandes et y lit l'avancement. Voir docker/backup/planificateur.sh.
      - backup_control:/controle
    expose:
      - "8000"
    networks:
      - intranet_dges_network

  # Sauvegarde quotidienne automatique.
  # Même image que la base : pg_dump doit être de la même version majeure que
  # le serveur, sinon le dump est refusé.
  backup:
    build:
      context: ./docker/backup
    container_name: intranet-dges-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      NEXTCLOUD_POSTGRES_HOST: nextcloud-db
      BACKUP_ROOT: /sauvegardes
      BACKUP_CONTROL_DIR: /controle
      TZ: ${DJANGO_TIME_ZONE:-Africa/Abidjan}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Les pièces jointes sont montées en écriture : la restauration doit
      # pouvoir les remettre en place, pas seulement les lire.
      - media_data:/media-intranet
      - nextcloud_data:/nextcloud-data:ro
      - backup_control:/controle
      # Le fichier .env et les certificats ne sont pas dans Git : sans eux, une
      # reconstruction sur une machine neuve part de zéro.
      - ./:/projet:ro
      # config.php de Nextcloud : il porte « passwordsalt » et « secret ». Sans
      # ce fichier, la base Nextcloud restaurée est inexploitable.
      - nextcloud_config:/nextcloud-config:ro
      # Destination sur la machine hôte. Le dossier est créé automatiquement.
      - ${BACKUP_DIR:-./sauvegardes}:/sauvegardes
    networks:
      - intranet_dges_network

  nextcloud-app:
    image: ${NEXTCLOUD_IMAGE}
    container_name: intranet-dges-nextcloud-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_POSTGRES_DB}
      POSTGRES_USER: ${NEXTCLOUD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_POSTGRES_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      REDIS_HOST: nextcloud-redis
      PHP_MEMORY_LIMIT: ${NEXTCLOUD_PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${NEXTCLOUD_PHP_UPLOAD_LIMIT}
      APACHE_BODY_LIMIT: ${NEXTCLOUD_APACHE_BODY_LIMIT}
      APACHE_DISABLE_REWRITE_IP: "1"
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_custom_apps:/var/www/html/custom_apps
      - nextcloud_config:/var/www/html/config
      - nextcloud_data:/var/www/html/data
      - ./docker/nextcloud/proxy.config.php:/var/www/html/config/proxy.config.php:ro
    expose:
      - "80"
    networks:
      - intranet_dges_network

  nextcloud-cron:
    image: ${NEXTCLOUD_IMAGE}
    container_name: intranet-dges-nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    env_file:
      - .env
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_POSTGRES_DB}
      POSTGRES_USER: ${NEXTCLOUD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_POSTGRES_PASSWORD}
      REDIS_HOST: nextcloud-redis
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
      nextcloud-app:
        condition: service_started
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_custom_apps:/var/www/html/custom_apps
      - nextcloud_config:/var/www/html/config
      - nextcloud_data:/var/www/html/data
      - ./docker/nextcloud/proxy.config.php:/var/www/html/config/proxy.config.php:ro
    networks:
      - intranet_dges_network

  nginx:
    image: nginx:1.27-alpine
    container_name: intranet-dges-nginx
    restart: unless-stopped
    depends_on:
      - web
      - nextcloud-app
    # Fonctionnement local uniquement : les ports n'écoutent que sur la boucle
    # locale. Rien n'est joignable depuis le réseau, quelles que soient les
    # règles du pare-feu — la plateforme ne s'y présente pas.
    #
    # Pour rouvrir l'accès aux équipes, retirer le préfixe « 127.0.0.1: » des
    # trois lignes et ajouter l'adresse fixe du serveur à ALLOWED_HOSTS et à
    # NEXTCLOUD_TRUSTED_DOMAINS dans .env.
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - static_data:/var/www/static
      - media_data:/var/www/media
    networks:
      - intranet_dges_network

volumes:
  postgres_data:
  static_data:
  media_data:
  nextcloud_postgres_data:
  nextcloud_redis_data:
  nextcloud_html:
  nextcloud_custom_apps:
  nextcloud_config:
  nextcloud_data:
  backup_control:

networks:
  intranet_dges_network:
    driver: bridge
