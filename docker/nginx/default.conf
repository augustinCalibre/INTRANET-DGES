# « Connection: upgrade » ne vaut que pour une requete qui demande vraiment a
# basculer en WebSocket. Le poser en dur sur toutes les requetes — ce que
# faisait la configuration precedente — brouille les echanges HTTP ordinaires
# de Nextcloud Talk, dont les longues requetes d'attente des nouveaux
# messages. Cette table renvoie « close » quand aucune bascule n'est demandee.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name intranet-dges.local intranetdges.local localhost _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name intranet-dges.local intranetdges.local localhost _;

    ssl_certificate /etc/nginx/certs/dges-local.crt;
    ssl_certificate_key /etc/nginx/certs/dges-local.key;

    client_max_body_size 20M;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name messagerie.dges.local;

    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name messagerie.dges.local messageriedges.local _;

    ssl_certificate /etc/nginx/certs/dges-local.crt;
    ssl_certificate_key /etc/nginx/certs/dges-local.key;

    client_max_body_size 2G;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /.well-known/carddav {
        return 301 /remote.php/dav;
    }

    location = /.well-known/caldav {
        return 301 /remote.php/dav;
    }

    # Talk recupere les nouveaux messages par de longues requetes d'attente :
    # le serveur garde la main jusqu'a ce qu'un message arrive, puis repond.
    # nginx ne doit pas retenir cette reponse en tampon, sans quoi le message
    # est bien enregistre mais n'atteint le destinataire qu'au rechargement
    # de la page.
    #
    # Pose ici, au niveau du serveur, et non sur le seul chemin de Talk :
    # Nextcloud sert les memes appels sous plusieurs prefixes selon sa
    # reecriture d'URL, et une regle ciblee laisserait passer les autres.
    proxy_buffering off;

    location / {
        proxy_pass http://nextcloud-app:80;
        # Sans cette ligne, nginx parle en HTTP/1.0 au conteneur : ni
        # connexion persistante, ni reponse en morceaux, et les en-tetes de
        # bascule WebSocket ci-dessous n'ont aucun effet.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }
}
